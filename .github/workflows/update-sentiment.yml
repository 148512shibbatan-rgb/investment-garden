 name: update-sentiment
  on:
    schedule:
      - cron: "0 23 * * *"
    workflow_dispatch: {}
  permissions:
    contents: write
  concurrency:
    group: update-sentiment
    cancel-in-progress: false
  jobs:
    update:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - run: pip install -r requirements.txt
        - run: python sentiment.py --emit-json quartz/static/sentiment.json
        - name: Commit if changed
          run: |
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git diff --quiet -- quartz/static/sentiment.json; then
              echo "no change"
            else
              git add quartz/static/sentiment.json
              git commit -m "chore(sentiment): update sentiment.json [skip ci]"
              git push
            fi
