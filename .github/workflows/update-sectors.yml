name: update-sectors
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-sectors
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python sector_returns.py --market us
      - run: python sector_returns.py --market jp
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- quartz/static/sector-returns-us.json quartz/static/sector-returns-jp.json; then
            echo "no change"
          else
            git add quartz/static/sector-returns-us.json quartz/static/sector-returns-jp.json
            git commit -m "chore(sectors): update sector-returns [skip ci]"
            git push
          fi
