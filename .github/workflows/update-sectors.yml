name: update-sectors
  on:
    schedule:
      - cron: "30 23 * * *"
    workflow_dispatch: {}
  permissions:
    contents: write   
  concurrency:
    group: update-sectors
    cancel-in-progress: false
  jobs:
    update:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - run: pip install -r requirements.txt
        - run: python sector_returns.py --market us
        - run: python sector_returns.py --market jp
        - name: Commit and push
          run: |
            git config user.name github-actions
            git config user.email actions@github.com
            git add quartz/static/sector-returns-us.json
            git add quartz/static/sector-returns-jp.json
            git commit -m "update sectors [skip ci]" || echo no-change
            git push
