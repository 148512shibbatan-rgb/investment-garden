<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>日米株センチメント指数</title>
<style>
  :root{
    --bg:#F7F6F2; --ink:#2b2a26; --sub:#6b6a63; --rule:#E7E3D8; --card:#ffffff;
    --b1:#378ADD; --b2:#639922; --b3:#888780; --b4:#BA7517; --b5:#E24B4A;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1d1f22; --ink:#e8e6df; --sub:#a3a199; --rule:#36383c; --card:#26282c; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Zen Kaku Gothic New", system-ui, -apple-system, "Hiragino Sans", sans-serif;
    padding:14px;
  }
  .wrap{ max-width:760px; margin:0 auto; }
  .gauges{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
  .card{ position:relative; background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:14px 12px 12px; }
  .card h3{ margin:0 0 2px; font-size:14px; letter-spacing:.04em; }
  .card .eyebrow{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--sub); }
  .flag{ position:absolute; top:10px; right:12px; font-size:55px; line-height:1; }
  .gsvg{ width:100%; max-width:230px; display:block; margin:2px auto 0; }
  .scorerow{ display:flex; align-items:baseline; gap:8px; margin-top:2px; }
  .score{ font-size:30px; font-weight:700; line-height:1; }
  .pill{ font-size:11px; font-weight:700; color:#fff; padding:3px 9px; border-radius:999px; }
  .nind{ font-size:11px; color:var(--sub); margin-left:auto; }
  .sparknote{ font-size:10px; color:var(--sub); margin-top:10px; }
  .hsvg{ width:100%; max-width:280px; display:block; margin:2px auto 0; }

  /* 凡例 */
  .legend{ background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:10px 12px; margin-top:14px; }
  .legend .lt{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--sub); margin-bottom:6px; }
  .lrow{ display:flex; flex-wrap:wrap; gap:6px 10px; }
  .li{ display:flex; align-items:center; gap:5px; font-size:11px; }
  .sw{ width:12px; height:12px; border-radius:3px; flex:none; }
  .li small{ color:var(--sub); }
  .larrow{ font-size:10px; color:var(--sub); margin-top:6px; display:flex; justify-content:space-between; }

  /* GLOBAL */
  .global{ background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:14px 14px 12px; margin-top:14px; }
  .ghead{ display:flex; align-items:baseline; gap:8px; }
  .gwrap{ position:relative; padding-top:40px; padding-bottom:26px; margin-top:6px; }
  .gbar{ position:relative; height:14px; border-radius:999px;
    background:linear-gradient(90deg,var(--b1) 0 20%,var(--b2) 20% 40%,var(--b3) 40% 60%,var(--b4) 60% 80%,var(--b5) 80% 100%); }
  .avgline{ position:absolute; top:-4px; bottom:-4px; width:3px; background:var(--ink); transform:translateX(-50%); border-radius:2px; }
  .mk{ position:absolute; transform:translateX(-50%); font-size:11px; white-space:nowrap; }
  .mk b{ font-weight:700; }
  .m-avg{ top:0; color:var(--ink); font-weight:700; }
  .m-avg::after{ content:""; display:block; width:0; height:0; margin:2px auto 0;
    border-left:5px solid transparent; border-right:5px solid transparent; border-top:7px solid var(--ink); }
  .m-jp{ top:20px; color:var(--sub); }
  .m-jp::after{ content:""; display:block; width:0; height:0; margin:1px auto 0;
    border-left:4px solid transparent; border-right:4px solid transparent; border-top:6px solid var(--sub); }
  .m-us{ bottom:0; color:var(--sub); }
  .m-us::before{ content:""; display:block; width:0; height:0; margin:0 auto 1px;
    border-left:4px solid transparent; border-right:4px solid transparent; border-bottom:6px solid var(--sub); }

  .meta{ font-size:11px; color:var(--sub); margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; }
  .stale{ color:var(--b4); }
  .disc{ font-size:10px; color:var(--sub); margin-top:10px; border-top:1px solid var(--rule); padding-top:8px; }
  .err{ font-size:13px; color:var(--sub); padding:18px; text-align:center; }
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="err" id="loading">データ取得中…</div>
</div>

<script>
// バンド: 色 / ラベル / 一言の意味 / スコア範囲
const BANDS = [
  {c:"var(--b1)", label:"悲壮",  mean:"パニック・底値圏", lo:0,  hi:20},
  {c:"var(--b2)", label:"弱気",  mean:"売られすぎ気味",   lo:20, hi:40},
  {c:"var(--b3)", label:"中立",  mean:"方向感なし",       lo:40, hi:60},
  {c:"var(--b4)", label:"強気",  mean:"過熱気味",         lo:60, hi:80},
  {c:"var(--b5)", label:"浮かれ",mean:"高値追い・過熱",   lo:80, hi:100},
];
const COLS = BANDS.map(b=>b.c);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const bandIdx = s => clamp(Math.floor(s/20),0,4);
const mmdd = d => { const p=d.slice(5).split('-'); return (+p[0])+'/'+(+p[1]); };

// 半円ゲージ。score 0=左, 100=右。
function polar(cx,cy,r,score){
  const t = Math.PI*(1 - score/100);
  return [cx + r*Math.cos(t), cy - r*Math.sin(t)];
}
function arc(cx,cy,r,s1,s2){
  const [x1,y1]=polar(cx,cy,r,s1), [x2,y2]=polar(cx,cy,r,s2);
  return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function gauge(score){
  const cx=100, cy=104, r=80, sw=30;
  let segs="";
  for(let i=0;i<5;i++){
    const lo=i*20, hi=lo+20-0.5;
    segs += `<path d="${arc(cx,cy,r,lo,hi)}" stroke="${COLS[i]}" stroke-width="${sw}" fill="none" stroke-linecap="butt"/>`;
  }
  // 太くした弧の中に漢字(白)
  const labs=["悲壮","弱気","中立","強気","浮かれ"].map((t,i)=>{
    const [lx,ly]=polar(cx,cy,r,i*20+10);
    return `<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">${t}</text>`;
  }).join("");
  // 境界の数字(弧の内側)
  const nums=[0,20,40,60,80,100].map(v=>{
    const [nx,ny]=polar(cx,cy,r-sw/2-6,v);
    return `<text x="${nx.toFixed(1)}" y="${(ny+2.5).toFixed(1)}" text-anchor="middle" font-size="7.5" fill="var(--sub)">${v}</text>`;
  }).join("");
  const [px,py]=polar(cx,cy,r-sw/2-1,score);
  return `<svg class="gsvg" viewBox="0 0 200 114" role="img" aria-label="センチメント ${Math.round(score)}点">
    ${segs}${labs}${nums}
    <line x1="${cx}" y1="${cy}" x2="${px.toFixed(2)}" y2="${py.toFixed(2)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="var(--ink)"/>
  </svg>`;
}
// 推移チャート(縦軸0-100・横軸 始点/終点の日付)
function histChart(hist){
  if(!hist||hist.length<2) return '<div class="sparknote">推移データなし</div>';
  const W=280,H=96, L=22, R=8, T=6, B=18;
  const pw=W-L-R, ph=H-T-B, n=hist.length;
  const X=i=> L + i*pw/(n-1);
  const Y=v=> T + (1-clamp(v,0,100)/100)*ph;
  // 縦軸: バンドごとに薄い色帯で塗り分け
  let bands="";
  for(let i=0;i<5;i++){
    const yTop=Y((i+1)*20), yBot=Y(i*20);
    bands += `<rect x="${L}" y="${yTop.toFixed(1)}" width="${pw.toFixed(1)}" height="${(yBot-yTop).toFixed(1)}" fill="${COLS[i]}" opacity="0.14"/>`;
  }
  // y目盛り(バンド境界)
  let yax="";
  for(const v of [0,20,40,60,80,100]){
    yax += `<text x="${L-3}" y="${(Y(v)+2.5).toFixed(1)}" text-anchor="end" font-size="7" fill="var(--sub)">${v}</text>`;
  }
  // x目盛り: 15営業日刻み
  let xax="";
  const step=15;
  for(let i=0;i<n;i+=step){
    const anchor = i===0 ? 'start' : 'middle';
    xax += `<line x1="${X(i).toFixed(1)}" y1="${T}" x2="${X(i).toFixed(1)}" y2="${(H-B).toFixed(1)}" stroke="var(--rule)" stroke-width="0.6" opacity="0.8"/>`;
    xax += `<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${anchor}" font-size="7" fill="var(--sub)">${mmdd(hist[i].date)}</text>`;
  }
  if((n-1)%step!==0){
    xax += `<text x="${X(n-1).toFixed(1)}" y="${H-5}" text-anchor="end" font-size="7" fill="var(--sub)">${mmdd(hist[n-1].date)}</text>`;
  }
  const pts=hist.map((p,i)=>`${X(i).toFixed(1)},${Y(p.score).toFixed(1)}`).join(' ');
  return `<div class="sparknote">推移（直近${n}営業日 ／ 縦軸0–100・色帯=バンド）</div>
    <svg class="hsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="センチメントの推移">
      ${bands}${yax}${xax}
      <polyline points="${pts}" fill="none" stroke="#0F7A55" stroke-width="1.6"/>
      <circle cx="${X(n-1).toFixed(1)}" cy="${Y(hist[n-1].score).toFixed(1)}" r="2.2" fill="#0F7A55"/>
    </svg>`;
}
function card(eyebrow,title,flag,maxN,m){
  if(!m) return `<div class="card"><span class="flag">${flag}</span><div class="eyebrow">${eyebrow}</div><h3>${title}</h3><div class="err">データなし</div></div>`;
  const col=COLS[bandIdx(m.score)];
  const stale = m.stale ? ' <span class="stale">前営業日値</span>' : '';
  return `<div class="card">
    <span class="flag" aria-hidden="true">${flag}</span>
    <div class="eyebrow">${eyebrow}</div>
    <h3>${title}</h3>
    ${gauge(m.score)}
    <div class="scorerow">
      <span class="score">${Math.round(m.score)}</span>
      <span class="pill" style="background:${col}">${m.band_label}</span>
      <span class="nind">採用 ${m.n_indicators}/${maxN}${stale}</span>
    </div>
    ${histChart(m.history)}
  </div>`;
}
fetch('/static/sentiment.json',{cache:'no-cache'})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{
    const root=document.getElementById('root');
    if(d.schema_version!==1){ root.innerHTML='<div class="err">表示を更新中です。</div>'; return; }
    const mk=d.markets||{};
    const anyStale = (mk.JP&&mk.JP.stale)||(mk.US&&mk.US.stale);
    root.innerHTML = `
      <div class="gauges">
        ${card("JAPAN","日本株 センチメント","🇯🇵",3,mk.JP)}
        ${card("US","米国株 センチメント","🇺🇸",5,mk.US)}
      </div>
      <div class="meta">
        <span>最終更新: ${d.as_of ?? '—'}</span>
        ${anyStale?'<span class="stale">一部の市場は前営業日値を表示中</span>':''}
      </div>
      <div class="disc">情報提供のみを目的とした指標です。投資助言ではありません。0–100は過去2年の分位（相対位置）で、高いほど強気・過熱、低いほど弱気・悲観を示します。</div>`;
  })
  .catch(()=>{ document.getElementById('root').innerHTML='<div class="err">指標データを取得できませんでした。</div>'; });
</script>
</body>
</html>
